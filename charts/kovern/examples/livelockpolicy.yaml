# Example LivelockPolicy — detect looping agents in the "team-payments" namespace.
# Phase 1: heuristic detection only (no Claude API key required).
# Phase 2: uncomment spec.detection.semantic to enable Claude-based detection.
apiVersion: kovern.io/v1alpha1
kind: LivelockPolicy
metadata:
  name: payments-loop-guard
  namespace: team-payments
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: agent
  detection:
    otel:
      maxSameToolCalls: 3    # Same tool called 3+ times in the window → loop
      windowSeconds: 60
      identicalResponseHash: true
    # semantic:                # Uncomment + set ANTHROPIC_API_KEY to enable
    #   enabled: true
    #   windowTurns: 3
    #   similarityThreshold: "0.92"
    #   model: claude-haiku-4-5-20251001
  remediation:
    # InjectFault (graceful HTTP 429 backoff) is not implemented yet — it
    # falls straight through to fallbackAction below (see
    # internal/remediation/executor.go). Set action: EvictPod or
    # SuspendWorkload directly if you don't want to rely on the fallback.
    action: InjectFault
    faultConfig:               # inert until InjectFault is implemented
      httpStatusCode: 429
      duration: "60s"
    fallbackAction: EvictPod   # this is what actually runs today
    emitEvent: true            # Write a K8s Warning Event on detection
    gitopsIncident: false      # inert — no GitOps integration yet (see roadmap.md Phase 5)
