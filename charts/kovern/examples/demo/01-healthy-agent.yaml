# ── SCENARIO A: HEALTHY AGENT ────────────────────────────────────────────────
#
# Demonstrates a well-behaved agent that stays within budget and does not
# trigger livelock detection.
#
# Expected outcome:
#   TokenQuota state:    Active  (12% of $50 budget spent)
#   LivelockPolicy:      no detection fired
#   Admission webhook:   pod creates ALLOWED ✓
#
# Apply: kubectl apply -f 01-healthy-agent.yaml
# Check: kubectl get tq research-agent-quota -n kovern-demo
#        kubectl get llp -n kovern-demo
# -----------------------------------------------------------------------------

# kagent Agent — research assistant that answers questions.
# The kovern.io/governed label wires it into the LivelockPolicy selector.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: research-agent
  namespace: kovern-demo
  labels:
    app.kubernetes.io/component: agent
    kovern.io/governed: "true"
    kovern.io/team: demo
    kovern.io/scenario: healthy
spec:
  type: Declarative
  declarative:
    runtime: python
    modelConfig: default-model-config
    systemMessage: |
      You are a helpful research assistant for the Plate Platform demo.
      You answer concise questions about cloud-native infrastructure, Kubernetes,
      and platform engineering. Each response is brief and informative.
    tools: []
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    a2aConfig:
      skills:
        - id: infra-research
          name: Infrastructure Research
          description: Answer questions about Kubernetes and cloud-native topics
          tags: [kubernetes, cloud-native, research]
---
# TokenQuota — $50 monthly budget, currently at 12% spend (well within limits).
# The webhook allows all new pod creates while state is Active or SoftLimit.
apiVersion: kovern.io/v1alpha1
kind: TokenQuota
metadata:
  name: research-agent-quota
  namespace: kovern-demo
spec:
  targetRef:
    kind: ServiceAccount
    name: research-agent          # kagent names the SA after the Agent resource
  billingScope:
    maxFinancialBudget: "50"
    renewalInterval: Monthly
    softLimitPct: 80              # emit K8s Warning Event at $40 spend
  enforcementAction: SuspendWorkload
---
# LivelockPolicy — healthy thresholds: same tool must repeat 5+ times
# in a 2-minute window before detection fires. A normal research agent
# calling diverse tools will never reach this.
apiVersion: kovern.io/v1alpha1
kind: LivelockPolicy
metadata:
  name: research-agent-loop-guard
  namespace: kovern-demo
spec:
  selector:
    matchLabels:
      kovern.io/scenario: healthy
  detection:
    otel:
      maxSameToolCalls: 5         # generous: 5 identical calls needed
      windowSeconds: 120          # 2-minute rolling window
      identicalResponseHash: true
    # semantic:                   # enable for LLM-based detection (Phase 2)
    #   enabled: true
    #   provider: Anthropic
    #   model: claude-haiku-4-5-20251001
    #   windowTurns: 3
    #   similarityThreshold: "0.92"
  remediation:
    action: InjectFault
    faultConfig:
      httpStatusCode: 429
      duration: "60s"
    fallbackAction: EvictPod
    emitEvent: true
