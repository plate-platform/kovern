apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kovern.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kovern.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kovern.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kovern.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kovern.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.operator.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.operator.healthPort }}
            - --webhook-port={{ .Values.webhook.port }}
            - --cert-dir={{ .Values.tls.certDir }}
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --otlp-addr=:{{ .Values.otlp.port }}
          ports:
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.operator.metricsPort }}
              protocol: TCP
            - name: otlp
              containerPort: {{ .Values.otlp.port }}
              protocol: TCP
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anthropic.apiKeySecret.name | default "kovern-api-keys" }}
                  key: {{ .Values.anthropic.apiKeySecret.key }}
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.google.apiKeySecret.name | default "kovern-api-keys" }}
                  key: {{ .Values.google.apiKeySecret.key }}
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.operator.healthPort }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.operator.healthPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: webhook-certs
              mountPath: {{ .Values.tls.certDir }}
              readOnly: false
      volumes:
        - name: webhook-certs
          {{- if .Values.tls.selfSigned }}
          emptyDir: {}
          {{- else }}
          secret:
            secretName: {{ .Values.tls.secretName }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
