apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kovern.fullname" . }}-manager-role
  labels:
    {{- include "kovern.labels" . | nindent 4 }}
rules:
  # TokenQuota management
  - apiGroups: [kovern.io]
    resources: [tokenquotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kovern.io]
    resources: [tokenquotas/status]
    verbs: [get, update, patch]
  - apiGroups: [kovern.io]
    resources: [tokenquotas/finalizers]
    verbs: [update]
  # LivelockPolicy management
  - apiGroups: [kovern.io]
    resources: [livelockpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [kovern.io]
    resources: [livelockpolicies/status]
    verbs: [get, update, patch]
  # Pod eviction for loop remediation
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Deployment scale-to-zero for enforcement
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, update, patch]
  # K8s Events for audit trail
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Leader election
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kovern.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kovern.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kovern.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kovern.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
