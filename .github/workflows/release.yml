name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  release:
    name: Build, scan, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/plate-platform/kovern
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (block on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/plate-platform/kovern:${{ steps.meta.outputs.version }}
          exit-code: "1"
          severity: CRITICAL
          format: sarif
          output: trivy-release.sarif

      - name: Upload scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-release.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/plate-platform/kovern:${{ steps.meta.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Extract semver without v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package Helm chart
        run: helm package charts/kovern/ --version ${{ steps.version.outputs.version }}

      - name: Push Helm chart to GHCR
        run: |
          helm push "kovern-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/plate-platform/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            sbom.cyclonedx.json
            kovern-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true
