version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      k8s-ecosystem:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      anthropic:
        patterns:
          - "github.com/anthropics/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
